<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noita Mod Forge</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">✦</span> Noita Mod Forge</div>
  <label class="modname">Mod <input id="mod-name" placeholder="My mod" spellcheck="false"></label>
  <div class="top-actions">
    <button id="btn-undo" title="Undo (Ctrl+Z)">↶</button>
    <button id="btn-redo" title="Redo (Ctrl+Shift+Z / Ctrl+Y)">↷</button>
    <div class="menu">
      <button id="btn-project">Project ▾</button>
      <div class="menu-pop" id="project-menu" hidden>
        <button data-act="new">New project</button>
        <button data-act="open">Open project (.json)…</button>
        <button data-act="save">Save project (.json)</button>
        <hr>
        <button data-act="import">Import game data…</button>
        <button data-act="reset-catalog">Use built-in reference data</button>
        <hr>
        <button data-act="help">Keyboard shortcuts</button>
      </div>
    </div>
    <button id="btn-export" class="primary" title="Download mod (Ctrl+S)">⬇ Export mod</button>
  </div>
</header>
<div class="layout">
  <nav class="sidenav" id="nav"></nav>
  <main id="main" tabindex="-1"></main>
  <aside id="inspector" class="inspector"></aside>
</div>
<div id="statusbar" class="statusbar"></div>
<div id="toasts" class="toasts"></div>
<div id="ctxmenu" class="ctxmenu" hidden></div>
<div id="modal" class="modal" hidden><div class="modal-card" id="modal-card"></div></div>
<div id="dropveil" class="dropveil" hidden><div>Drop game data folder / files, a project .json, or images</div></div>
<input type="file" id="file-open" accept=".json,application/json" hidden>
<input type="file" id="file-import" multiple hidden>
<input type="file" id="dir-import" webkitdirectory directory multiple hidden>
<input type="file" id="file-sprite" accept="image/png" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
